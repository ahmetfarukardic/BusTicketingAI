name: BusTicketingAI CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - prod

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Image Tag
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./BusTicketingAI.WebApi/Dockerfile 
          push: true
          tags: ahmet377/busticketingai-backend-api:${{ env.SHA_SHORT }},ahmet377/busticketingai-backend-api:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./BusTicketingAI.Client/Dockerfile
          push: true
          tags: ahmet377/busticketingai-frontend:${{ env.SHA_SHORT }},ahmet377/busticketingai-frontend:latest

      - name: Update K8s Manifests
        run: |
          # YAML dosyalarındaki eski imaj etiketlerini yenisiyle (SHA_SHORT) değiştir
          sed -i "s|image: ahmet377/busticketingai-backend-api:.*|image: ahmet377/busticketingai-backend-api:${{ env.SHA_SHORT }}|g" k8s/backend-deployment.yaml
          sed -i "s|image: ahmet377/busticketingai-frontend:.*|image: ahmet377/busticketingai-frontend:${{ env.SHA_SHORT }}|g" k8s/frontend-deployment.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml
          git commit -m "ci: update image tags to ${{ env.SHA_SHORT }} [skip ci]"
          git push