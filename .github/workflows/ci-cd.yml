name: BusTicketingAI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./BusTicketingAI.WebApi/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/busticketingai-backend-api:latest

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./BusTicketingAI.Client
        file: ./BusTicketingAI.Client/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/busticketingai-frontend-ui:latest